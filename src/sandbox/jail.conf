#############################
# Sandbox Defined Variables #
#############################

$sandbox_id = "dummy_sandbox_id";
$slot_id = "1";

$zfs_dataset = "zroot/jail0";
$zfs_dataset_quota = "7G";

$pcpu = "200";
$memoryuse = "4g";
$maxproc = "100";
$nthr = "100";
$msgqqueued = "0";
$msgqsize = "0";
$nmsgq = "0";
$nsem = "0";
$nsemop = "0";
$nshm = "0";
$shmsize = "0";

#######################
# Sandboxer Constants #
#######################

$sandboxer_root_dir = "/var/muzan/sandboxer";
$bridge_if = "bridge0";

#####################
# Derived Variables #
#####################

$sandbox_dir = "${sandboxer_root_dir}/sandbox.d/${sandbox_id}";
$jail_root_dir = "${sandbox_dir}/jail_root";
$exec_consolelog = "${sandbox_dir}/jail_exec_consolelog.txt";
$hostname = "sandbox.${sandbox_id}.local";

######################
# Jail Configuration #
######################

my_sandbox_id {
    jid = "${slot_id}";

    path = "${jail_root_dir}";

    persist;

    # Network
    vnet;
    vnet.interface = "epair${slot_id}a";
    host.hostname = "${hostname}";

    # Filesystems
    mount;
    mount.devfs;
    devfs_ruleset = 100;

    # Permissions
    allow.quotas = 1;
    allow.reserved_ports = 1;
    allow.set_hostname = 0;
    allow.sysvipc = 0;
    allow.raw_sockets = 0;
    allow.chflags = 0;
    allow.mount = 0;
    allow.mount.devfs = 0;
    allow.read_msgbuf = 0;
    allow.socket_af = 0;
    allow.mlock = 0;
    allow.nfsd = 0;
    allow.unprivileged_parent_tampering = 0;
    allow.unprivileged_proc_debug = 0;
    allow.suser = 0;
    allow.extattr = 0;
    allow.adjtime = 0;
    allow.settime = 0;
    allow.routing = 0;
    allow.setaudit = 0;

    securelevel = 2;
    children.max = 10;

    # SysV IPC
    sysvshm = new;
    sysvsem = new;
    sysvmsg = new;

    ########################
    # Jail lifecycle hooks #
    ########################

    exec.consolelog = "${exec_consolelog}";

    # exec.prepare
    # Execute outside jail, before filesystems are mounted.
    exec.prepare = "echo exec.prepare";
    # TODO: Clone from a bsdinstall
    exec.prepare += "zfs create ${zfs_dataset}";
    exec.prepare += "zfs set quota=${zfs_dataset_quota} ${zfs_dataset}";
    exec.prepare += "zfs set mountpoint=${jail_root_dir} ${zfs_dataset}";
    exec.prepare += "mkdir -p ${jail_root_dir}/dev";

    # exec.prestart
    # Execute outside jail, before jail is created.
    exec.prestart = "echo exec.prestart";
    exec.prestart += "ifconfig epair${slot_id} create";
    exec.prestart += "ifconfig ${bridge_if} addm epair${slot_id}b";
    exec.prestart += "ifconfig ${bridge_if} private epair${slot_id}b";
    exec.prestart += "ifconfig epair${slot_id}b up";

    # exec.created
    # Execute outside jail, after jail is created.
    exec.created = "echo exec.created";
    exec.created += "rctl -a 'jail:${name}:pcpu:deny=${pcpu}'";
    exec.created += "rctl -a 'jail:${name}:memoryuse:deny=${memoryuse}'";
    exec.created += "rctl -a 'jail:${name}:maxproc:deny=${maxproc}'";
    exec.created += "rctl -a 'jail:${name}:nthr:deny=${nthr}'";
    exec.created += "rctl -a 'jail:${name}:msgqqueued:deny=${msgqqueued}'";
    exec.created += "rctl -a 'jail:${name}:msgqsize:deny=${msgqsize}'";
    exec.created += "rctl -a 'jail:${name}:nmsgq:deny=${nmsgq}'";
    exec.created += "rctl -a 'jail:${name}:nsem:deny=${nsem}'";
    exec.created += "rctl -a 'jail:${name}:nsemop:deny=${nsemop}'";
    exec.created += "rctl -a 'jail:${name}:nshm:deny=${nshm}'";
    exec.created += "rctl -a 'jail:${name}:shmsize:deny=${shmsize}'";

    # exec.start
    # Execute inside jail, after jail is created.
    exec.start = "echo exec.start";
    exec.start += "/sbin/ifconfig lo0 127.0.0.1 up";
    exec.start += "/sbin/ifconfig epair${slot_id}a up";
    exec.start += "/bin/sh -c 'echo \"timeout 5;\" | /sbin/dhclient -1 -cf /dev/stdin epair${slot_id}a'";
    exec.start += "/bin/sh /etc/rc";

    # exec.stop
    # Execute inside jail, before jail is removed.
    exec.stop = "echo exec.stop";
    exec.stop += "/bin/sh /etc/rc.shutdown";

    # exec.poststop
    # Execute outside jail, before jail is removed.
    exec.poststop = "echo exec.poststop";
    exec.poststop += "ifconfig ${bridge_if} deletem epair${slot_id}b";
    exec.poststop += "ifconfig epair${slot_id}b destroy";

    # exec.release
    # Execute outside jail, after jail is removed.
    exec.release = "echo exec.release";
    exec.release += "zfs destroy -r ${zfs_dataset}";
}
